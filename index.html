<main>
    <button id="enableNotifBtn">เปิดระบบแจ้งเตือนเมื่อปริมาณน้ำลด</button>
    <div class="controls">
        <!-- แนะนำให้ลบคำค้นหาออกเพื่อดูข้อมูลทั้งหมดก่อน -->
        <input type="text" id="searchInput" placeholder="ค้นหา ชื่อสถานี, ตำบล, อำเภอ หรือ จังหวัด...">
        <select id="intervalSelect">
            <option value="1">อัพเดททุก 1 นาที</option>
            <option value="5" selected>อัพเดททุก 5 นาที (แนะนำ)</option>
            <option value="15">อัพเดททุก 15 นาที</option>
        </select>
    </div>
    
    <p class="status-text">อัพเดทข้อมูลล่าสุด: <span id="lastUpdate">กำลังโหลด...</span></p>
    <p id="errorMsg" class="error-msg"></p>
    
    <div id="locationList" class="location-list">
        <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ -->
    </div>
</main>

<script>
    let locations = [];
    let updateInterval;
    let intervalTime = 60000 * 5; 

    const RESOURCE_ID = "61aff6a1-7733-4596-b68d-b490d802732c";
    // เปลี่ยนมาใช้ API มาตรฐานของ CKAN ที่ลดปัญหา CORS และจำกัดแค่ 100 รายการก่อนให้โหลดเร็ว
    const API_URL = `https://data.go.th/api/3/action/datastore_search?resource_id=${RESOURCE_ID}&limit=100`;

    document.addEventListener('DOMContentLoaded', () => {
        fetchData();
        setupEventListeners();
        startAutoUpdate();
    });

    function setupEventListeners() {
        document.getElementById('searchInput').addEventListener('input', renderList);
        
        document.getElementById('intervalSelect').addEventListener('change', (e) => {
            intervalTime = parseInt(e.target.value) * 60000;
            startAutoUpdate();
        });

        document.getElementById('enableNotifBtn').addEventListener('click', () => {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("เปิดระบบแจ้งเตือนสำเร็จ! แอปจะแจ้งเตือนเมื่อปริมาณฝน/น้ำลดลง");
                } else {
                    alert("กรุณาอนุญาตการแจ้งเตือนในตั้งค่าเบราว์เซอร์");
                }
            });
        });
    }

    function startAutoUpdate() {
        clearInterval(updateInterval);
        updateInterval = setInterval(fetchData, intervalTime);
    }

    async function fetchData() {
        document.getElementById('errorMsg').innerText = "";
        document.getElementById('lastUpdate').innerText = "กำลังดึงข้อมูล...";
        
        try {
            // ดึงข้อมูลโดยไม่ต้องส่ง Header API Key เนื่องจากเป็นข้อมูลสาธารณะ
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const jsonData = await response.json();
            
            if (!jsonData.result || !jsonData.result.records || jsonData.result.records.length === 0) {
                 throw new Error("ไม่พบข้อมูลในระบบ");
            }

            const currentData = jsonData.result.records;
            processNewData(currentData);
            
            const now = new Date();
            document.getElementById('lastUpdate').innerText = now.toLocaleTimeString('th-TH');
        } catch (error) {
            console.error("เกิดข้อผิดพลาด:", error);
            document.getElementById('lastUpdate').innerText = "โหลดข้อมูลล้มเหลว";
            document.getElementById('errorMsg').innerText = "ขัดข้อง: ไม่สามารถเชื่อมต่อฐานข้อมูลได้";
        }
    }

    function processNewData(newData) {
        const savedData = JSON.parse(localStorage.getItem('bkk_flood_data')) || {};
        
        const formattedData = newData.map(item => {
            let levelStr = item.Rainfall_12H || item.Rainfall_24H || item.water_level || item.Rainfall || "0";
            let rainLevel = parseFloat(levelStr); 
            if (isNaN(rainLevel)) rainLevel = 0;
            
            let name = item.STN_NAME || item.ชื่อสถานี || item.station_name || item.ชื่อ || `สถานี ${item._id}`;
            let district = item.อำเภอ || item.district || item.เขต || '';
            let province = item.จังหวัด || item.province || '';
            let locText = district ? `อ.${district} จ.${province}` : province;

            return {
                id: item._id || item.STN_ID,
                name: name,
                district: locText,
                level: rainLevel
            };
        });

        formattedData.forEach(loc => {
            const oldLevel = savedData[loc.id]?.level;
            
            if (oldLevel !== undefined && loc.level < oldLevel) {
                const dropAmount = (oldLevel - loc.level).toFixed(1);
                if (oldLevel > 5 && dropAmount >= 1) {
                    sendNotification(loc.name, oldLevel, loc.level, dropAmount);
                }
            }
            
            savedData[loc.id] = loc;
        });

        localStorage.setItem('bkk_flood_data', JSON.stringify(savedData));
        locations = formattedData;
        
        // ล้างช่องค้นหาอัตโนมัติเมื่อโหลดครั้งแรก เพื่อให้ผู้ใช้เห็นข้อมูลว่ามีอะไรบ้าง
        if (document.getElementById('searchInput').value === "ถนนลาดพร้าว") {
             document.getElementById('searchInput').value = "";
        }
        
        renderList();
    }

    function sendNotification(locationName, oldLevel, newLevel, dropAmount) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`ระดับลดลงที่ ${locationName}`, {
                body: `ลดลง ${dropAmount} มม. (เหลือ ${newLevel} มม.)`
            });
        }
    }

    function renderList() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        const listContainer = document.getElementById('locationList');
        listContainer.innerHTML = '';

        if (locations.length === 0) {
             listContainer.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">ไม่มีข้อมูลจากเซิร์ฟเวอร์</p>';
             return;
        }

        const filtered = locations.filter(loc => 
            loc.name.toLowerCase().includes(searchTerm) || 
            loc.district.toLowerCase().includes(searchTerm)
        );

        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">ไม่พบข้อมูลที่คุณค้นหา ลองพิมพ์ชื่อจังหวัดดูครับ</p>';
            return;
        }

        filtered.forEach(loc => {
            let statusClass = 'level-low';
            let statusText = 'ปกติ';
            
            if (loc.level > 90) { 
                statusClass = 'level-high'; 
                statusText = 'วิกฤต (สูงมาก)'; 
            } else if (loc.level > 35) { 
                statusClass = 'level-med'; 
                statusText = 'เฝ้าระวัง'; 
            }

            const div = document.createElement('div');
            div.className = 'location-card';
            div.innerHTML = `
                <div class="loc-info">
                    <h3>${loc.name}</h3>
                    <p>${loc.district}</p>
                    <p style="font-size:0.75rem; margin-top:3px;">สถานะ: <strong class="${statusClass}">${statusText}</strong></p>
                </div>
                <div class="water-level ${statusClass}">
                    ${loc.level} <span style="font-size:0.8rem">มม.</span>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }
</script>
